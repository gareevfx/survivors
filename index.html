<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survivors</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <strong>Survivors</strong>
        </div>
        <div class="readout" title="Dumps in the Silo">
          <span class="swatch ore"></span>
          <span>Dumps</span>
          <b id="ore">0</b>
        </div>
        <div class="readout" title="Cells in use. Training is not limited by Cells.">
          <span class="swatch pop"></span>
          <span>Cells</span>
          <b id="supply">0 / 0</b>
        </div>
        <div id="clock">0:00</div>
        <div id="sides" class="sides"></div>
        <div class="top-actions">
          <button id="idle" type="button" title="Select idle stalkers (F)">Idle</button>
          <button id="pause" type="button" aria-pressed="false" title="Pause the match (Pause)">Pause</button>
          <button id="menu-btn" type="button" title="Pause and return to the menu">Menu</button>
        </div>
      </header>

      <div id="hint">
        <p>Destroy the enemy Silo and defend your own. Select the stalkers and right-click the dumps beside the Silo.</p>
        <button id="hint-x" type="button">Got it</button>
      </div>

      <div id="stage">
        <canvas id="view" tabindex="0" aria-label="Survivors battlefield"></canvas>
        <div id="paused" class="hidden">Paused</div>
        <div id="ai-badge" class="hidden">SiloAI</div>
        <div id="both-badge" class="hidden">Both cam</div>
        <div id="modeflag" class="hidden"></div>
        <form id="console" class="hidden" autocomplete="off">
          <label for="console-input">Command</label>
          <input id="console-input" type="text" spellcheck="false" placeholder="write here" aria-label="Command" />
        </form>
        <div id="toasts"></div>
      </div>

      <footer id="dock">
        <canvas id="minimap" aria-label="Minimap"></canvas>
        <section id="inspect"></section>
        <section id="commands"></section>
      </footer>

      <div id="overlay" class="hidden">
        <div class="card">
          <p class="eyebrow" id="end-kicker"></p>
          <h2 id="end-title"></h2>
          <p id="end-copy"></p>
          <button id="again" type="button">Fight again</button>
          <button id="to-menu" type="button">Main menu</button>
          <p class="seed" id="end-seed"></p>
        </div>
      </div>

      <div id="menu">
        <div class="card menu-card">
          <p class="eyebrow">Survivors</p>
          <h2>Surface</h2>
          <p>The field waits. Pick who stands on it. The match starts when you choose.</p>
          <button id="menu-duel" type="button">1 vs 1</button>
          <p class="meta" id="menu-duel-note"></p>
          <button id="menu-ffa" type="button">Free for all (4 players)</button>
          <p class="meta" id="menu-ffa-note"></p>
          <button id="menu-resume" type="button" class="hidden">Resume</button>
        </div>
      </div>

    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
